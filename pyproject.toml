[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-sis"
version = "0.1.0"
description = "Finite-population SIS dynamics on voxel-level tracer connectivity"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [{name = "gretarsson"}]
dependencies = ["numpy==2.0.2", "scipy==1.13.1", "numba==0.60.0", "matplotlib==3.9.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
pixel-sis = "pixel_sis.cli:main"

[project.urls]
Repository = "https://github.com/gretarsson/pixel-sis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: requires the local prepared Allen/MERFISH dataset"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"] # I (infected) and O (observation operator) match the equations.
